name: Deploy to Sliplane

# Secrets required:
#   GITHUB_PERSONAL_ACCESS_TOKEN — GitHub PAT (repo scope) used to create and
#     update GitHub Deployment records, providing an audit trail on the repo's
#     Deployments page.
#   SLIPLANE_DEPLOY_HOOK_URL — Sliplane webhook URL that triggers an immediate
#     redeploy of the production service when POSTed to.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Create GitHub deployment
        id: create_deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_PERSONAL_ACCESS_TOKEN }}
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              description: 'Deploy to Sliplane',
              auto_merge: false,
              required_contexts: [],
            });
            core.setOutput('deployment_id', deployment.data.id);
            return deployment.data.id;

      - name: Mark deployment as in_progress
        if: steps.create_deployment.outputs.deployment_id
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_PERSONAL_ACCESS_TOKEN }}
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create_deployment.outputs.deployment_id }},
              state: 'in_progress',
              description: 'Sliplane deploy triggered',
              environment_url: 'https://gestionale-appuntamenti.sliplane.app',
            });

      - name: Trigger Sliplane deploy
        id: deploy
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.SLIPLANE_DEPLOY_HOOK_URL }}")
          echo "status=$HTTP_STATUS" >> "$GITHUB_OUTPUT"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Deploy hook returned HTTP $HTTP_STATUS — treating as failure."
            exit 1
          fi
          echo "Deploy hook accepted (HTTP $HTTP_STATUS)."

      - name: Mark deployment as success
        if: success() && steps.create_deployment.outputs.deployment_id
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_PERSONAL_ACCESS_TOKEN }}
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create_deployment.outputs.deployment_id }},
              state: 'success',
              description: 'Deployed to Sliplane',
              environment_url: 'https://gestionale-appuntamenti.sliplane.app',
            });

      - name: Mark deployment as failure
        if: failure() && steps.create_deployment.outputs.deployment_id
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_PERSONAL_ACCESS_TOKEN }}
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create_deployment.outputs.deployment_id }},
              state: 'failure',
              description: 'Sliplane deploy failed',
              environment_url: 'https://gestionale-appuntamenti.sliplane.app',
            });

      - name: Write failure summary
        if: failure()
        run: |
          echo "## Deployment Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The deployment to **Sliplane** failed on branch \`${{ github.ref_name }}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Author | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Workflow run | [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Please check the workflow logs and the Sliplane dashboard for details." >> "$GITHUB_STEP_SUMMARY"
